<html>
    <head>
        <link rel="stylesheet" href="index.css">
        
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div id="homeDiv">
                <h3 class="hTag" >HOME</h3>
                <p id="homeScore"></p>
                <div id="button">
                <button class="Button" onclick="homeaddOne()">+1</button>
                <button class="Button" onclick="homeaddTwo()">+2</button>
                <button class="Button" onclick="homeaddThree()">+3</button>
                </div>
            </div>
            <div id="guestDiv">
                <h3 class="hTag">AWAY</h3>
                <p id="guestScore"></p>
                <div id="button">
                <button class="Button" onclick="guestaddOne()"">+1</button>
                <button class="Button" onclick="guestaddTwo()"">+2</button>
                <button class="Button" onclick="guestaddThree()">+3</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
